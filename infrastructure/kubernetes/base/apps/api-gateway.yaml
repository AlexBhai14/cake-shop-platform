apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: cake-shop
  labels:
    app: api-gateway
    app.kubernetes.io/part-of: cake-shop
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: api-gateway
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0   # never remove a working pod before the new one is ready
      maxSurge: 1
  template:
    metadata:
      labels:
        app: api-gateway
        app.kubernetes.io/part-of: cake-shop
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: /metrics
    spec:
      containers:
      - name: api-gateway
        image: cake-shop/api-gateway:latest   # replaced by the overlay (local or dockerhub)
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 3000
        envFrom:
        - configMapRef:
            name: cake-config
        env:
        - name: PORT
          value: "3000"
        - name: JWT_ACCESS_SECRET
          valueFrom:
            secretKeyRef:
              name: cake-secrets
              key: JWT_ACCESS_SECRET
        startupProbe:        # the container may run database migrations first: give it up to 150 s
          httpGet: { path: /health, port: http }
          periodSeconds: 5
          failureThreshold: 30
        readinessProbe:      # "may I receive traffic?"
          httpGet: { path: /health, port: http }
          periodSeconds: 10
          failureThreshold: 3
        livenessProbe:       # "is the process alive?" (restart when it keeps failing)
          httpGet: { path: /health, port: http }
          periodSeconds: 15
          failureThreshold: 4
        resources:
          requests: { cpu: 100m, memory: 160Mi }
          limits: { cpu: 500m, memory: 384Mi }
        securityContext:
          allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: cake-shop
  labels:
    app: api-gateway
spec:
  selector:
    app: api-gateway
  ports:
  - name: http
    port: 3000
    targetPort: http
