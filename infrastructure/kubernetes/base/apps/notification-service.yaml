apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: cake-shop
  labels:
    app: notification-service
    app.kubernetes.io/part-of: cake-shop
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: notification-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0   # never remove a working pod before the new one is ready
      maxSurge: 1
  template:
    metadata:
      labels:
        app: notification-service
        app.kubernetes.io/part-of: cake-shop
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3008"
        prometheus.io/path: /metrics
    spec:
      containers:
      - name: notification-service
        image: cake-shop/notification-service:latest   # replaced by the overlay (local or dockerhub)
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 3008
        envFrom:
        - configMapRef:
            name: cake-config
        env:
        - name: PORT
          value: "3008"
        - name: JWT_ACCESS_SECRET
          valueFrom:
            secretKeyRef:
              name: cake-secrets
              key: JWT_ACCESS_SECRET
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: cake-secrets
              key: NOTIFICATION_DB_PASSWORD
        - name: DATABASE_URL
          value: mysql://notification_user:$(DB_PASSWORD)@mysql:3306/cake_notification_db
        - name: SHADOW_DATABASE_URL
          value: mysql://notification_user:$(DB_PASSWORD)@mysql:3306/cake_notification_db_shadow
        - name: RABBITMQ_USER
          valueFrom:
            secretKeyRef:
              name: cake-secrets
              key: RABBITMQ_USER
        - name: RABBITMQ_PASSWORD
          valueFrom:
            secretKeyRef:
              name: cake-secrets
              key: RABBITMQ_PASSWORD
        - name: RABBITMQ_URL
          value: amqp://$(RABBITMQ_USER):$(RABBITMQ_PASSWORD)@rabbitmq:5672
        startupProbe:        # the container may run database migrations first: give it up to 150 s
          httpGet: { path: /health, port: http }
          periodSeconds: 5
          failureThreshold: 30
        readinessProbe:      # "may I receive traffic?"
          httpGet: { path: /health/ready, port: http }
          periodSeconds: 10
          failureThreshold: 3
        livenessProbe:       # "is the process alive?" (restart when it keeps failing)
          httpGet: { path: /health, port: http }
          periodSeconds: 15
          failureThreshold: 4
        resources:
          requests: { cpu: 100m, memory: 160Mi }
          limits: { cpu: 500m, memory: 384Mi }
        securityContext:
          allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: cake-shop
  labels:
    app: notification-service
spec:
  selector:
    app: notification-service
  ports:
  - name: http
    port: 3008
    targetPort: http
