apiVersion: apps/v1
kind: Deployment
metadata:
  name: customer-app
  namespace: cake-shop
  labels:
    app: customer-app
    app.kubernetes.io/part-of: cake-shop
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: customer-app
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: customer-app
        app.kubernetes.io/part-of: cake-shop
    spec:
      containers:
      - name: customer-app
        image: cake-shop/customer-app:latest
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 80
        readinessProbe:
          httpGet: { path: /, port: http }
          periodSeconds: 10
        livenessProbe:
          httpGet: { path: /, port: http }
          periodSeconds: 20
        resources:
          requests: { cpu: 25m, memory: 32Mi }
          limits: { cpu: 200m, memory: 128Mi }
        securityContext:
          allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: customer-app
  namespace: cake-shop
  labels:
    app: customer-app
spec:
  selector:
    app: customer-app
  ports:
  - name: http
    port: 80
    targetPort: http
