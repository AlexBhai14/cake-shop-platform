# MODE 1 (default): the NestJS services run on your PC with npm run start:dev.
# Prometheus runs in Docker and reaches them through host.docker.internal.
# Prometheus scrapes GET /metrics of every service every 15 seconds.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
  - job_name: api-gateway
    metrics_path: /metrics
    static_configs:
      - targets: ['host.docker.internal:3000']
  - job_name: auth-service
    metrics_path: /metrics
    static_configs:
      - targets: ['host.docker.internal:3001']
  - job_name: user-service
    metrics_path: /metrics
    static_configs:
      - targets: ['host.docker.internal:3002']
  - job_name: product-service
    metrics_path: /metrics
    static_configs:
      - targets: ['host.docker.internal:3003']
  - job_name: cart-service
    metrics_path: /metrics
    static_configs:
      - targets: ['host.docker.internal:3004']
  - job_name: inventory-service
    metrics_path: /metrics
    static_configs:
      - targets: ['host.docker.internal:3005']
  - job_name: order-service
    metrics_path: /metrics
    static_configs:
      - targets: ['host.docker.internal:3006']
  - job_name: payment-service
    metrics_path: /metrics
    static_configs:
      - targets: ['host.docker.internal:3007']
  - job_name: notification-service
    metrics_path: /metrics
    static_configs:
      - targets: ['host.docker.internal:3008']
  # RabbitMQ: totals (rabbitmq_prometheus plugin)
  - job_name: rabbitmq
    static_configs:
      - targets: ['rabbitmq:15692']
  # RabbitMQ: messages per queue (this is how dead letter queues are watched)
  - job_name: rabbitmq-detailed
    metrics_path: /metrics/detailed
    params:
      family: ['queue_coarse_metrics']
    static_configs:
      - targets: ['rabbitmq:15692']
