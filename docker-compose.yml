# Local development stack. Start infrastructure first:
#   docker compose up -d mysql redis rabbitmq mailpit
services:
  mysql:
    image: mysql:8.4
    container_name: cake-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD}
      USER_DB_PASSWORD: ${USER_DB_PASSWORD}
      PRODUCT_DB_PASSWORD: ${PRODUCT_DB_PASSWORD}
      CART_DB_PASSWORD: ${CART_DB_PASSWORD}
      INVENTORY_DB_PASSWORD: ${INVENTORY_DB_PASSWORD}
      ORDER_DB_PASSWORD: ${ORDER_DB_PASSWORD}
      PAYMENT_DB_PASSWORD: ${PAYMENT_DB_PASSWORD}
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD}
      TZ: UTC
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./infrastructure/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # 127.0.0.1 forces TCP, so this fails during MySQL's temporary init phase
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  redis:
    image: redis:7-alpine
    container_name: cake-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: cake-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
      - "127.0.0.1:15692:15692"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./infrastructure/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 30s

  mailpit:
    image: axllent/mailpit:latest
    container_name: cake-mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

  auth-service:
    build:
      context: ./backend/auth-service
    container_name: cake-auth-service
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PORT: 3001
      DATABASE_URL: mysql://auth_user:${AUTH_DB_PASSWORD}@mysql:3306/cake_auth_db
      SHADOW_DATABASE_URL: mysql://auth_user:${AUTH_DB_PASSWORD}@mysql:3306/cake_auth_db_shadow
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_ACCESS_TTL: 15m
      REFRESH_TOKEN_TTL_DAYS: 7
      BCRYPT_ROUNDS: 12
    ports:
      - "127.0.0.1:3001:3001"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  user-service:
    build:
      context: ./backend/user-service
    container_name: cake-user-service
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PORT: 3002
      DATABASE_URL: mysql://user_user:${USER_DB_PASSWORD}@mysql:3306/cake_user_db
      SHADOW_DATABASE_URL: mysql://user_user:${USER_DB_PASSWORD}@mysql:3306/cake_user_db_shadow
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
    ports:
      - "127.0.0.1:3002:3002"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3002/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  product-service:
    build:
      context: ./backend/product-service
    container_name: cake-product-service
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PORT: 3003
      DATABASE_URL: mysql://product_user:${PRODUCT_DB_PASSWORD}@mysql:3306/cake_product_db
      SHADOW_DATABASE_URL: mysql://product_user:${PRODUCT_DB_PASSWORD}@mysql:3306/cake_product_db_shadow
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
    ports:
      - "127.0.0.1:3003:3003"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3003/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  cart-service:
    build:
      context: ./backend/cart-service
    container_name: cake-cart-service
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PORT: 3004
      DATABASE_URL: mysql://cart_user:${CART_DB_PASSWORD}@mysql:3306/cake_cart_db
      SHADOW_DATABASE_URL: mysql://cart_user:${CART_DB_PASSWORD}@mysql:3306/cake_cart_db_shadow
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      PRODUCT_SERVICE_URL: http://product-service:3003
    ports:
      - "127.0.0.1:3004:3004"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3004/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  api-gateway:
    build:
      context: ./backend/api-gateway
    container_name: cake-api-gateway
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      PORT: 3000
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      REDIS_URL: redis://redis:6379
      CORS_ORIGINS: http://localhost:5173,http://localhost:5174
      AUTH_SERVICE_URL: http://auth-service:3001
      USER_SERVICE_URL: http://user-service:3002
      PRODUCT_SERVICE_URL: http://product-service:3003
      CART_SERVICE_URL: http://cart-service:3004
      INVENTORY_SERVICE_URL: http://inventory-service:3005
      ORDER_SERVICE_URL: http://order-service:3006
      PAYMENT_SERVICE_URL: http://payment-service:3007
      NOTIFICATION_SERVICE_URL: http://notification-service:3008
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  inventory-service:
    build:
      context: ./backend/inventory-service
    container_name: cake-inventory-service
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      PORT: 3005
      DATABASE_URL: mysql://inventory_user:${INVENTORY_DB_PASSWORD}@mysql:3306/cake_inventory_db
      SHADOW_DATABASE_URL: mysql://inventory_user:${INVENTORY_DB_PASSWORD}@mysql:3306/cake_inventory_db_shadow
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672
    ports:
      - "127.0.0.1:3005:3005"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3005/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  order-service:
    build:
      context: ./backend/order-service
    container_name: cake-order-service
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      PORT: 3006
      DATABASE_URL: mysql://order_user:${ORDER_DB_PASSWORD}@mysql:3306/cake_order_db
      SHADOW_DATABASE_URL: mysql://order_user:${ORDER_DB_PASSWORD}@mysql:3306/cake_order_db_shadow
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672
      CART_SERVICE_URL: http://cart-service:3004
      USER_SERVICE_URL: http://user-service:3002
    ports:
      - "127.0.0.1:3006:3006"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3006/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  payment-service:
    build:
      context: ./backend/payment-service
    container_name: cake-payment-service
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      PORT: 3007
      DATABASE_URL: mysql://payment_user:${PAYMENT_DB_PASSWORD}@mysql:3306/cake_payment_db
      SHADOW_DATABASE_URL: mysql://payment_user:${PAYMENT_DB_PASSWORD}@mysql:3306/cake_payment_db_shadow
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672
      AUTO_PAY_SCENARIO: ${AUTO_PAY_SCENARIO:-NONE}
      TIMEOUT_RESOLVES_TO: SUCCEEDED
      RECONCILE_AFTER_SECONDS: 30
    ports:
      - "127.0.0.1:3007:3007"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3007/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  notification-service:
    build:
      context: ./backend/notification-service
    container_name: cake-notification-service
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      PORT: 3008
      DATABASE_URL: mysql://notification_user:${NOTIFICATION_DB_PASSWORD}@mysql:3306/cake_notification_db
      SHADOW_DATABASE_URL: mysql://notification_user:${NOTIFICATION_DB_PASSWORD}@mysql:3306/cake_notification_db_shadow
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      MAIL_FROM: Cake Shop <no-reply@cakeshop.local>
    ports:
      - "127.0.0.1:3008:3008"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3008/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  customer-app:
    build:
      context: ./frontend/customer-app
      args:
        VITE_API_URL: http://localhost:3000
    container_name: cake-customer-app
    restart: unless-stopped
    depends_on:
      api-gateway:
        condition: service_healthy
    ports:
      - "127.0.0.1:5173:80"

  admin-app:
    build:
      context: ./frontend/admin-app
      args:
        VITE_API_URL: http://localhost:3000
    container_name: cake-admin-app
    restart: unless-stopped
    depends_on:
      api-gateway:
        condition: service_healthy
    ports:
      - "127.0.0.1:5174:80"

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: cake-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      # MODE 1 (default): services run on your PC.  MODE 2: set PROMETHEUS_CONFIG=./infrastructure/monitoring/prometheus/prometheus.yml
      - ${PROMETHEUS_CONFIG:-./infrastructure/monitoring/prometheus/prometheus.host.yml}:/etc/prometheus/prometheus.yml:ro
      - ./infrastructure/monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana:11.2.0
    container_name: cake-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Add GRAFANA_ADMIN_PASSWORD to your .env file}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "127.0.0.1:3030:3000"
    volumes:
      - ./infrastructure/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana

volumes:
  mysql-data:
  redis-data:
  rabbitmq-data:
  prometheus-data:
  grafana-data:
