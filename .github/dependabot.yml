# Dependabot opens pull requests for outdated or vulnerable dependencies. The CI pipeline tests each one.
version: 2
updates:
  - package-ecosystem: npm
    directories: ['/', '/backend/*', '/frontend/*', '/tests/e2e']
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directories: ['/backend/*', '/frontend/*']
    schedule:
      interval: weekly
